name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Web Bluetooth only works in a secure context, so the built site has to be served
# over HTTPS. GitHub Pages issues and renews the certificate for the custom domain.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a half-published service worker is worse than a delay.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The frame builders are the whole product; a red test must not reach the domain.
      - run: npm test
      - run: npm run check
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
